<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMove - Announcements</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        .filter-chip {
            padding: 0.5rem 1.25rem;
            border-radius: 99px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-chip:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .filter-chip.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
    </style>
</head>
<body>
    <header class="standard-header">
        <a href="index.html" class="logo">SmartMove.</a>
        <nav class="standard-nav">
            <a href="announcements.html" style="color: var(--primary-accent);">Announcements</a>
            <a href="routes.html">Routes</a>
            <a href="reviews.html">Reviews</a>
            <a href="book.html">Book Ticket</a>
        </nav>
        <div class="hero-actions">
            <a href="system-portal/login.html" class="btn-transparent" style="color: var(--text-main);">Admin Login</a>
        </div>
    </header>
    
    <main class="page-main">
        <div class="gsap-fade-down" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 2.5rem;">
            <div>
                <h1 class="section-title">All Announcements</h1>
                <p style="font-size: 1.1rem; color: var(--text-secondary); margin-top: 0.5rem;">
                    Real-time operational updates, travel advisories, and system notices.
                </p>
            </div>
            <!-- Search & Filter Controls -->
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                <div style="position: relative; width: 280px;">
                    <input type="text" id="searchInput" placeholder="Search announcements..." 
                        style="width: 100%; padding: 0.65rem 1rem 0.65rem 2.4rem; border-radius: 99px; border: 1.5px solid #e2e8f0; font-size: 0.9rem; outline: none; background: #ffffff;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%);">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Filter Chips -->
        <div style="display: flex; gap: 0.75rem; margin-bottom: 2.5rem; flex-wrap: wrap;">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="info">Notices</button>
            <button class="filter-chip" data-filter="warning">Cautions</button>
            <button class="filter-chip" data-filter="alert">Urgent Alerts</button>
        </div>

        <!-- Announcements Grid -->
        <div id="allAnnouncementsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.75rem;">
            <p style="color: #64748b;">Loading announcements...</p>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 SmartMove Transport Solutions. All rights reserved.</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/announcements.js"></script>
</body>
</html>
