<!DOCTYPE html>
<html lang="en">
<head>

    <title>SmartMove - Fleet Management</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .fleet-card {
            border-radius: 16px;

            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);

        .fleet-img {
            width: 100%;
            height: 200px;
            object-fit: cover;

        }
        .fleet-info {
            padding: 1.5rem;
        }

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">SmartMove.</a>

    <main>
        <h1>Fleet Management</h1>
        <p style="margin-bottom: 3rem;">View vehicle documents and multimedia powered by MongoDB.</p>

        <div id="fleetGrid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));">
