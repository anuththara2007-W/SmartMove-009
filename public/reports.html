<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMove - Reports & BI</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .revenue-card {
            background: linear-gradient(135deg, #0071e3 0%, #4facfe 100%);
            color: white;
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 113, 227, 0.3);
            margin-bottom: 3rem;
        }
        .revenue-display {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 1rem 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">SmartMove.</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="routes.html">Routes</a>
                <a href="book.html">Book Ticket</a>
                <a href="reviews.html">Reviews</a>
                <a href="admin.html">Fleet</a>
                <a href="reports.html" style="color: var(--primary-accent);">Reports</a>
            </div>
        </nav>
    </header>
    <main>
        <h1>Business Intelligence</h1>
        <p style="margin-bottom: 3rem;">Powered by Oracle PL/SQL integration.</p>

        <div class="revenue-card">
            <h3 style="font-weight: 500; opacity: 0.9; font-size: 1.2rem;">Lifetime Revenue</h3>
            <div id="revenueDisplay" class="revenue-display">$0.00</div>
            <button id="calcRevenueBtn" class="btn-primary" style="background: white; color: #0071e3; margin-top: 1rem;">
                Calculate Latest Revenue
            </button>
            <p id="revenueMessage" style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8; display: none;"></p>
        </div>

        <h2 style="font-size: 1.8rem; margin-bottom: 1.5rem;">Most Frequent Routes</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Route ID</th>
                        <th>Route Name</th>
                        <th style="text-align: right;">Total Trips</th>
                    </tr>
                </thead>
                <tbody id="frequentRoutesTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-secondary);">Loading PL/SQL procedure results...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 SmartMove Transport Solutions. All rights reserved.</p>
    </footer>
    <script src="js/reports.js"></script>
</body>
</html>
